<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#222222" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- MLCQ source -->
  <rect x="90" y="20" width="260" height="44" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="220" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">MLCQ dataset</text>
  <text x="220" y="55" text-anchor="middle" font-size="12" fill="#444444">4,770 code samples (14,739 reviews)</text>
  <line x1="220" y1="64" x2="220" y2="96" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Filtering -->
  <rect x="90" y="96" width="260" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="220" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Filtering &amp; enrichment</text>
  <text x="220" y="131" text-anchor="middle" font-size="12" fill="#444444">476 smell occurrences</text>
  <line x1="220" y1="142" x2="220" y2="174" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="230" y="160" font-size="11" font-style="italic" fill="#666666">group by file</text>

  <!-- Grouping (file-level, shaded) -->
  <rect x="90" y="174" width="260" height="46" rx="5" fill="#eeece6" stroke="#333333" stroke-width="1"/>
  <text x="220" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Grouping by file</text>
  <text x="220" y="209" text-anchor="middle" font-size="12" fill="#444444">436 files</text>
  <line x1="220" y1="220" x2="220" y2="252" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Review generation (file-level, shaded) -->
  <rect x="90" y="252" width="260" height="50" rx="5" fill="#eeece6" stroke="#333333" stroke-width="1"/>
  <text x="220" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Review generation (LLM)</text>
  <text x="220" y="287" text-anchor="middle" font-size="12" fill="#444444">410 files reviewed</text>
  <text x="362" y="272" font-size="11" fill="#666666">26 excluded</text>
  <text x="362" y="286" font-size="11" fill="#666666">(context limit)</text>
  <line x1="220" y1="302" x2="220" y2="334" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="230" y="320" font-size="11" font-style="italic" fill="#666666">expand to occurrences</text>

  <!-- Re-expansion -->
  <rect x="90" y="334" width="260" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="220" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Re-expansion</text>
  <text x="220" y="369" text-anchor="middle" font-size="12" fill="#444444">444 smell occurrences</text>
  <line x1="220" y1="380" x2="220" y2="412" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- IHMU classification -->
  <rect x="90" y="412" width="260" height="50" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="220" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">IHMU classification (LLM judge)</text>
  <text x="220" y="447" text-anchor="middle" font-size="12" fill="#444444">438 classified</text>
  <text x="362" y="432" font-size="11" fill="#666666">6 excluded</text>
  <text x="362" y="446" font-size="11" fill="#666666">(context limit)</text>
</svg>
